# ==============================================================================
# Wind Forecast Intelligence — Nginx Reverse Proxy & Static Asset Server
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Gzip compression for text, scripts, styles, and data
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Root directory for production static build assets
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable Vite static assets (hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Reverse proxy: forward /api/ requests to the FastAPI backend service
    # The browser issues same-origin requests to /api/ which Nginx proxies
    # over the Docker bridge network to http://backend:8000/api/
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
